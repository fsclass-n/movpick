services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movpick-api
    env_file: .env
    environment:
      BACKEND_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8000:8000"
    shm_size: "1gb"  # Chromium 안정 구동
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    container_name: movpick-web
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
