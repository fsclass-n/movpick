name: CGV Collector

# CGV(Cloudflare WAF)는 국외 IP(Render·GitHub 호스티드 러너 = 미국)를 403 으로 차단한다.
# 국내 서버에 self-hosted runner 를 등록하고 repo variable CGV_RUNNER(러너 라벨)를 설정하면
# 30분마다 수집해 백엔드 /api/rpa/ingest 로 전송한다. (repo secret: RPA_INGEST_TOKEN)
# CGV_RUNNER 미설정 시 스케줄 실행은 건너뛰고, 수동 실행(workflow_dispatch)은 진단용으로 GitHub 러너에서 돈다.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: cgv-collector
  cancel-in-progress: false

jobs:
  collect:
    if: ${{ vars.CGV_RUNNER != '' || github.event_name == 'workflow_dispatch' }}
    # Playwright 1.52 install-deps 는 Ubuntu 26(ubuntu-latest) 미지원 → 24.04 고정
    runs-on: ${{ vars.CGV_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    env:
      PYTHONIOENCODING: utf-8
      TZ: Asia/Seoul
      MOVPICK_API_URL: ${{ vars.MOVPICK_API_URL || 'https://movpick-api.onrender.com' }}
      RPA_INGEST_TOKEN: ${{ secrets.RPA_INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install Chromium (Playwright fallback)
        continue-on-error: true  # 1차 수집은 HTTP 방식이라 브라우저 없이도 동작
        run: python -m playwright install --with-deps --only-shell chromium
      - name: Collect CGV and push
        run: |
          if [ -n "$RPA_INGEST_TOKEN" ]; then
            python -m rpa.runner --chain cgv --mode real --days 2 --push "$MOVPICK_API_URL"
          else
            echo "::warning::RPA_INGEST_TOKEN secret 미설정 → 수집 테스트만 실행 (전송 생략)"
            python -m rpa.runner --chain cgv --mode real --days 2
          fi
