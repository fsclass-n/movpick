services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movpick-api
    env_file: .env
    environment:
      BACKEND_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8000:8000"
    shm_size: "1gb"  # Chromium 안정 구동
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # 국내 서버(예: Oracle Cloud Free Tier 서울/춘천, AWS 서울)에서 CGV 상주 수집기 실행
  #   docker compose --profile collector up -d cgv-collector
  cgv-collector:
    profiles: ["collector"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movpick-cgv-collector
    env_file: .env
    command: >
      python -m rpa.runner --chain cgv --mode real --days 2 --every 30
      --push ${MOVPICK_API_URL:-https://movpick-api.onrender.com}
    shm_size: "1gb"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    container_name: movpick-web
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
